name: Build SwitFire APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: แตกไฟล์โปรเจกต์ (ถ้าอัปโหลดมาเป็น zip)
        run: |
          if ! find . -name settings.gradle.kts | grep -q .; then
            for z in *.zip; do unzip -q -o "$z"; done
          fi
          DIR=$(dirname "$(find . -name settings.gradle.kts | head -1)")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "โปรเจกต์อยู่ที่: $DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: สร้างไฟล์ APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/output/SwitFire.apk"

      - name: สรุป error (ทำงานเฉพาะตอน build ไม่ผ่าน)
        if: failure()
        run: |
          echo "=============== บรรทัด error ที่ต้องแก้ ==============="
          grep -E "^e: |^w: .*error|error:" "$GITHUB_WORKSPACE/build.log" | head -40 || echo "ไม่พบบรรทัด error แบบ Kotlin"
          echo "===================================================="

      - uses: actions/upload-artifact@v4
        with:
          name: SwitFire-APK
          path: output/SwitFire.apk
